services:
  postgres:
    image: postgres:16-alpine
    container_name: eventify_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventify_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventify_password}
      POSTGRES_DB: ${POSTGRES_DB:-eventify_events}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eventify_user} -d ${POSTGRES_DB:-eventify_events}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: